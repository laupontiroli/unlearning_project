# PLAN §6: Stage 1, Portuguese only -> θ_ref
name: stage1
data_dir: data
model_config: configs/model.yaml
init_from: null                # train from scratch
mixture: {pt_train: 64}        # sequences per batch from each split
block_size: 512
lr: 1.0e-3
min_lr: 1.0e-4
betas: [0.9, 0.95]
weight_decay: 0.1
grad_clip: 1.0
warmup_steps: 200
# Timing run (2026-11-23, MacBook Air M4, MPS fp32): 0.917 steps/s after warm-up, 16.1 s per eval
# (results/timing.jsonl). PLAN §6 asks for a 30-40 min run: 2000 steps * 1.09 s = 36.4 min, + 5 evals = ~38 min.
# Characters seen = 2000 * 32,768 = 65.5M = 0.82 epochs of pt_train (80M). Cost ~ 6 * 4.9M * 65.5M = 1.9e15 FLOPs.
max_steps: 2000
eval_interval: 500
eval_batches: 100              # fixed batches per eval split (same every time)
eval_batch_size: 16
eval_splits: [pt_val, en_val, pt_train]   # pt_train = fixed train chunks, to compare train vs val (overfitting)
ckpt_interval: 1000
final_name: ref                # -> checkpoints/ref_s{seed}.pt
protect_final: true            # chmod a-w + SHA-256 in results/ref_hashes.json; never overwritten
