# PLAN §7: Stage 2 diagnostic θ_en = θ_ref + pure English (shows catastrophic forgetting of PT). DRAFT.
# Init from θ_ref = ref_long (deviation D4); fresh optimizer (init_from loads weights only).
name: stage2_en
data_dir: data
model_config: configs/model.yaml
init_from: checkpoints/ref_long_s{seed}.pt
mixture: {en_forget_train: 64}
block_size: 512
lr: 3.0e-4
min_lr: 3.0e-5
betas: [0.9, 0.95]
weight_decay: 0.1              # same as stage 1 (the plan does not change it)
grad_clip: 1.0
warmup_steps: 100
max_steps: 500                 # fixed by the plan
eval_interval: 100
eval_batches: 100
eval_batch_size: 16
eval_splits: [pt_val, en_val, pt_train, en_forget_train]
ckpt_interval: 250
final_name: theta_en          # -> checkpoints/theta_en_s{seed}.pt (diagnostic only)
hashes_file: model_hashes.json
protect_final: true
