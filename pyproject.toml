[project]
name = "unlearnlang"
version = "0.1.0"
description = "Language-level unlearning in a character-level transformer"
readme = "README.md"
authors = [
    { name = "laupontiroli", email = "laurapm@al.insper.edu.br" }
]
requires-python = ">=3.11"
dependencies = [
    "datasets>=5.2.0",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pyarrow>=26.0.1",
    "pytest>=9.2.0",
    "pyyaml>=6.0.3",
    "torch>=2.15.0",
    "tqdm>=4.70.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
